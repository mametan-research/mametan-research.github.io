<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>まめ探｜問いから始まる知的探究メディア</title>

  <meta
    name="description"
    content="まめ探（MAMETAN）は、ジャンルを限定せず、あらゆる視点から世界の本質を探究する知的探究メディアです。"
  >

  <meta name="theme-color" content="#f8f6f1">

  <style>
    :root {
      --background: #f8f6f1;
      --surface: #fbfaf7;
      --text: #20231f;
      --subtext: #666a63;
      --line: #d9d7d0;
      --accent: #536b45;
      --header-height: 144px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        "Meiryo",
        sans-serif;
      line-height: 1.8;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    /* =========================
       ヘッダー
    ========================= */

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      width: 100%;
    }

    .header-inner {
      min-height: var(--header-height);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding-top: 36px;
    }

    .brand {
      display: inline-block;
    }

    .brand-name {
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.12em;
    }

    .brand-english {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.36em;
    }

    .brand-description {
      display: block;
      margin-top: 17px;
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.12em;
    }

    .menu-button {
      position: relative;
      width: 52px;
      height: 52px;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-button span {
      position: absolute;
      left: 7px;
      width: 38px;
      height: 1px;
      background: var(--text);
      transition:
        top 0.3s ease,
        transform 0.3s ease,
        opacity 0.2s ease;
    }

    .menu-button span:nth-child(1) {
      top: 15px;
    }

    .menu-button span:nth-child(2) {
      top: 25px;
    }

    .menu-button span:nth-child(3) {
      top: 35px;
    }

    .menu-button[aria-expanded="true"] span:nth-child(1) {
      top: 25px;
      transform: rotate(45deg);
    }

    .menu-button[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
    }

    .menu-button[aria-expanded="true"] span:nth-child(3) {
      top: 25px;
      transform: rotate(-45deg);
    }

    /* =========================
       メニュー
    ========================= */

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 15;
      visibility: hidden;
      background: rgba(32, 35, 31, 0.16);
      opacity: 0;
      transition:
        visibility 0.3s ease,
        opacity 0.3s ease;
    }

    .menu-overlay.is-visible {
      visibility: visible;
      opacity: 1;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 18;
      width: min(390px, 88vw);
      height: 100%;
      padding:
        max(120px, env(safe-area-inset-top))
        44px
        40px;
      background: var(--surface);
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform 0.35s ease;
    }

    .side-menu.is-open {
      transform: translateX(0);
    }

    .menu-list {
      list-style: none;
    }

    .menu-list li + li {
      margin-top: 30px;
    }

    .menu-list a {
      display: inline-block;
      position: relative;
      padding-bottom: 5px;
      font-size: 16px;
      letter-spacing: 0.08em;
    }

    .menu-list a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .menu-list a:hover::after,
    .menu-list a:focus-visible::after {
      transform: scaleX(1);
    }

    .menu-copyright {
      position: absolute;
      right: 44px;
      bottom: max(38px, env(safe-area-inset-bottom));
      left: 44px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--subtext);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    /* =========================
       ファーストビュー
    ========================= */

    .hero {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        calc(var(--header-height) + 68px)
        24px
        76px;
      text-align: center;
    }

    .hero-inner {
      width: min(900px, 100%);
      transform: translateY(20px);
    }

    .hero-title {
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: clamp(36px, 6.2vw, 70px);
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.08em;
    }

    .hero-divider {
      width: 42px;
      height: 1px;
      margin: 32px auto 30px;
      background: var(--accent);
    }

    .hero-message {
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: clamp(16px, 2.3vw, 22px);
      line-height: 2;
      letter-spacing: 0.1em;
    }

    .scroll-guide {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      margin-top: 74px;
      color: var(--accent);
    }

    .scroll-line {
      width: 1px;
      height: 60px;
      background: var(--accent);
    }

    .scroll-text {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-indent: 0.32em;
    }

    .scroll-arrow {
      width: 12px;
      height: 12px;
      border-right: 1px solid var(--accent);
      border-bottom: 1px solid var(--accent);
      transform: rotate(45deg);
      animation: float-arrow 1.8s ease-in-out infinite;
    }

    @keyframes float-arrow {
      0%,
      100% {
        transform: translateY(0) rotate(45deg);
      }

      50% {
        transform: translateY(7px) rotate(45deg);
      }
    }

    /* =========================
       最新記事
    ========================= */

    .latest {
      padding: 112px 0 120px;
      background: var(--surface);
      border-top: 1px solid var(--line);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      margin-bottom: 58px;
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: clamp(27px, 4vw, 38px);
      font-weight: 400;
      letter-spacing: 0.14em;
    }

    .section-heading::before,
    .section-heading::after {
      content: "";
      width: min(230px, 22vw);
      height: 1px;
      background: var(--text);
    }

    .article-list {
      width: min(850px, 100%);
      margin: 0 auto;
      border-top: 1px solid var(--line);
    }

    .article-item {
      display: grid;
      grid-template-columns: 128px 1fr 40px;
      align-items: center;
      min-height: 112px;
      border-bottom: 1px solid var(--line);
    }

    .article-date {
      color: var(--subtext);
      font-family:
        "Times New Roman",
        serif;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .article-title {
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: clamp(16px, 2.1vw, 20px);
      line-height: 1.7;
      letter-spacing: 0.08em;
    }

    .article-arrow {
      display: block;
      font-size: 28px;
      font-weight: 300;
      text-align: right;
      transition: transform 0.2s ease;
    }

    .article-item:hover .article-arrow {
      transform: translateX(5px);
    }

    .all-articles {
      display: flex;
      justify-content: center;
      margin-top: 52px;
    }

    .all-articles a {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--text);
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: 15px;
      letter-spacing: 0.1em;
    }

    .preparing {
      width: min(850px, 100%);
      margin: 0 auto;
      padding: 60px 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .preparing-title {
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
      font-size: clamp(18px, 2.4vw, 23px);
      letter-spacing: 0.1em;
    }

    .preparing-text {
      margin-top: 12px;
      color: var(--subtext);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    /* =========================
       フッター
    ========================= */

    .site-footer {
      padding:
        46px
        24px
        calc(46px + env(safe-area-inset-bottom));
      background: var(--background);
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 0;
      margin-bottom: 26px;
      list-style: none;
    }

    .footer-links li {
      display: flex;
      align-items: center;
    }

    .footer-links li:not(:last-child)::after {
      content: "";
      width: 1px;
      height: 13px;
      margin: 0 24px;
      background: var(--line);
    }

    .footer-links a {
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .copyright {
      color: var(--subtext);
      font-family:
        "Times New Roman",
        serif;
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 720px) {
      :root {
        --header-height: 126px;
      }

      .container {
        width: min(100% - 36px, 1120px);
      }

      .header-inner {
        padding-top: 25px;
      }

      .brand-name {
        font-size: 31px;
      }

      .brand-english {
        margin-top: 7px;
        font-size: 11px;
      }

      .brand-description {
        margin-top: 13px;
        font-size: 11px;
      }

      .menu-button {
        width: 44px;
        height: 44px;
      }

      .menu-button span {
        left: 6px;
        width: 32px;
      }

      .menu-button span:nth-child(1) {
        top: 12px;
      }

      .menu-button span:nth-child(2) {
        top: 21px;
      }

      .menu-button span:nth-child(3) {
        top: 30px;
      }

      .menu-button[aria-expanded="true"] span:nth-child(1),
      .menu-button[aria-expanded="true"] span:nth-child(3) {
        top: 21px;
      }

      .hero {
        min-height: 100svh;
        padding:
          calc(var(--header-height) + 55px)
          22px
          56px;
      }

      .hero-inner {
        transform: none;
      }

      .hero-title {
        font-size: clamp(31px, 9vw, 43px);
        line-height: 1.65;
      }

      .hero-divider {
        margin: 28px auto 25px;
      }

      .hero-message {
        font-size: 15px;
        line-height: 1.9;
      }

      .scroll-guide {
        margin-top: 58px;
      }

      .scroll-line {
        height: 47px;
      }

      .latest {
        padding: 78px 0 84px;
      }

      .section-heading {
        gap: 18px;
        margin-bottom: 38px;
        font-size: 26px;
      }

      .section-heading::before,
      .section-heading::after {
        width: 48px;
      }

      .article-item {
        grid-template-columns: 1fr 28px;
        min-height: 116px;
        padding: 22px 2px;
      }

      .article-date {
        grid-column: 1;
        margin-bottom: 7px;
        font-size: 11px;
      }

      .article-title {
        grid-column: 1;
        font-size: 16px;
      }

      .article-arrow {
        grid-column: 2;
        grid-row: 1 / 3;
        align-self: center;
        font-size: 24px;
      }

      .all-articles {
        margin-top: 42px;
      }

      .footer-links {
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .footer-links li:not(:last-child)::after {
        display: none;
      }

      .side-menu {
        padding-right: 34px;
        padding-left: 34px;
      }

      .menu-copyright {
        right: 34px;
        left: 34px;
      }
    }

    /* 動きを減らす設定への配慮 */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="まめ探 ホーム">
        <div class="brand-name">まめ探</div>
        <div class="brand-english">MAMETAN</div>
        <span class="brand-description">
          問いから始まる知的探究メディア
        </span>
      </a>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="メニューを開く"
        aria-controls="sideMenu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>

  <nav
    class="side-menu"
    id="sideMenu"
    aria-label="メインメニュー"
    aria-hidden="true"
  >
    <ul class="menu-list">
      <li>
        <a href="./">ホーム</a>
      </li>

      <li>
        <a href="#latest">最新記事</a>
      </li>

      <li>
        <a href="about.html">まめ探について</a>
      </li>

      <li>
        <a href="operator.html">運営者情報</a>
      </li>
    </ul>

    <p class="menu-copyright">
      © 2026 MAMETAN
    </p>
  </nav>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">
          世界は、<br>
          一つの答えでは語れない。
        </h1>

        <div class="hero-divider"></div>

        <p class="hero-message">
          あらゆる視点から、本質を探究する。
        </p>

        <a class="scroll-guide" href="#latest" aria-label="最新記事へ移動">
          <span class="scroll-line"></span>
          <span class="scroll-text">SCROLL</span>
          <span class="scroll-arrow"></span>
        </a>
      </div>
    </section>

    <section class="latest" id="latest">
      <div class="container">
        <h2 class="section-heading">最新記事</h2>

        <div class="preparing">
          <p class="preparing-title">
            最初の探究を準備しています。
          </p>

          <p class="preparing-text">
            新しい視点と、深い問いをお届けします。
          </p>
        </div>

        <!--
        記事公開後は、上の「preparing」を削除して、
        以下の article-list を使用します。

        <div class="article-list">

          <a class="article-item" href="articles/article-001.html">
            <time class="article-date" datetime="2026-08-06">
              2026.08.06
            </time>

            <h3 class="article-title">
              最初の記事タイトル
            </h3>

            <span class="article-arrow" aria-hidden="true">→</span>
          </a>

        </div>

        <div class="all-articles">
          <a href="articles.html">
            すべての記事を見る
            <span aria-hidden="true">→</span>
          </a>
        </div>
        -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <ul class="footer-links">
      <li>
        <a href="#latest">最新記事</a>
      </li>

      <li>
        <a href="about.html">まめ探について</a>
      </li>

      <li>
        <a href="operator.html">運営者情報</a>
      </li>
    </ul>

    <p class="copyright">
      © 2026 MAMETAN
    </p>
  </footer>

  <script>
    const menuButton = document.getElementById("menuButton");
    const sideMenu = document.getElementById("sideMenu");
    const menuOverlay = document.getElementById("menuOverlay");
    const menuLinks = sideMenu.querySelectorAll("a");

    function openMenu() {
      document.body.classList.add("menu-open");
      sideMenu.classList.add("is-open");
      menuOverlay.classList.add("is-visible");

      menuButton.setAttribute("aria-expanded", "true");
      menuButton.setAttribute("aria-label", "メニューを閉じる");
      sideMenu.setAttribute("aria-hidden", "false");
    }

    function closeMenu() {
      document.body.classList.remove("menu-open");
      sideMenu.classList.remove("is-open");
      menuOverlay.classList.remove("is-visible");

      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "メニューを開く");
      sideMenu.setAttribute("aria-hidden", "true");
    }

    function toggleMenu() {
      const isOpen =
        menuButton.getAttribute("aria-expanded") === "true";

      if (isOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    menuButton.addEventListener("click", toggleMenu);
    menuOverlay.addEventListener("click", closeMenu);

    menuLinks.forEach(function(link) {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
  </script>
</body>
</html>
